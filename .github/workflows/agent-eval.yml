name: agent-eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: DeepSeek model
        required: true
        default: deepseek-flash

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      QUESTOPS_DEEPSEEK_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require real credential
        run: test -n "$DEEPSEEK_API_KEY"
      - name: Install Harness runtime
        run: |
          python -m pip install deepseek-harness-sdk
          npm install --global pnpm@10
      - name: Run 30-case real Agent benchmark
        run: python evals/run_eval.py --model "${{ inputs.model }}" --output artifacts/evals/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: questops-agent-eval
          path: artifacts/evals/
